# Local/demo stack: PostgreSQL 17 + the Python AI service + backend.
#
# The AI service is part of THIS stack on purpose. It used to live only in the
# root compose, so the documented local startup left the backend without a
# document/PDF service: every AI feature (including "Generate Journal with AI")
# silently degraded until someone started it by hand.
#
# Usage:
#   1. cp .env.example .env, fill in the two required secrets below, review the rest.
#   2. docker compose up -d --build
#   3. Seed the load-test admin (optional): see loadtest/seed.sql.
#   4. API: http://localhost:8080 | docs: http://localhost:8080/swagger-ui.html
#
# Secrets (SPRING_DATASOURCE_PASSWORD, STEG_JWT_SECRET) have NO defaults on
# purpose: compose fails fast with an explicit message if they are unset, so a
# weak or committed value can never slip into any environment silently.
# Flyway migrates automatically on backend startup (baseline-on-migrate).

services:
  postgres:
    image: postgres:17-alpine
    container_name: steg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-steg}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-stegdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-steg} -d ${POSTGRES_DB:-stegdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Python document-intelligence (FastAPI). Started automatically with the
  # stack and gated on a REAL readiness probe (token configured + the journal
  # PDF renderer actually emits a PDF), not merely "the process started".
  python-ai:
    build:
      context: ../ai-services
      dockerfile: Dockerfile
    image: steg-doc-intel:local
    container_name: steg-doc-intel
    restart: unless-stopped
    # The shared service token lives in EXACTLY ONE file: the repo-root .env.
    # It used to be resolved from this project's own .env, so this container
    # and the backend could be handed two different secrets and every call
    # would be rejected with 401 (reported as "AI unavailable"). env_file pins
    # both sides to the same source so they cannot drift apart again.
    env_file:
      - ../.env
    ports:
      - "${PYTHON_AI_PORT:-8000}:8000"
    healthcheck:
      # /ready fails unless the token is set AND a PDF can be produced, so a
      # misconfigured or half-built service never reports healthy.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: steg-backend:local
    container_name: steg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ready, not merely started: Spring Boot must not fire AI requests at a
      # service that is still importing or has no usable renderer.
      python-ai:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # Same canonical source as python-ai above: the shared token is defined
    # once, in ../.env, and handed to both services unchanged.
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stegdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-steg}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env (see .env.example)}
      # No default: a missing JWT secret must fail the stack, never silently weaken auth.
      STEG_JWT_SECRET: ${STEG_JWT_SECRET:?set STEG_JWT_SECRET in .env (see .env.example)}
      JWT_ACCESS_EXP_MINUTES: ${JWT_ACCESS_EXP_MINUTES:-15}
      JWT_REFRESH_EXP_DAYS: ${JWT_REFRESH_EXP_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200}
      STORAGE_LOCAL_ROOT: /app/storage/uploads
      # Python AI service. Centralised, never hardcoded to a Docker hostname so
      # the same settings work when the backend runs outside compose.
      PYTHON_AI_SERVICE_BASE_URL: http://python-ai:8000
      PYTHON_AI_TIMEOUT_MS: ${PYTHON_AI_TIMEOUT_MS:-20000}
      PYTHON_AI_MAX_ATTEMPTS: ${PYTHON_AI_MAX_ATTEMPTS:-2}
      PYTHON_AI_CIRCUIT_THRESHOLD: ${PYTHON_AI_CIRCUIT_THRESHOLD:-5}
    volumes:
      - storage:/app/storage/uploads
    healthcheck:
      # Liveness, not full readiness: the AI service going down must not make
      # Docker restart the whole backend (it would drop live sessions). Its own
      # status is reported separately by the pythonAiService health component.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  storage:
